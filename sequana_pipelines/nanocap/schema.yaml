type: map
mapping:
    "sequana_wrappers":
        type: str
        required: true
    
    "input_directory":
        type: str
        required: true

    "input_pattern":
        type: str
        required: true

    "reference":
        type: str
        required: true

    "apptainers":
        type: any

    "fastp":
        type: map
        mapping:
            "options":
                type: text
                required: false
            "threads":
                type: int
                required: true
            "resources":
                type: any
                required: true


    "minimap2":
        type: map
        mapping:
            "options":
                type: text
                required: false
            "threads":
                type: int
                required: true

    "multiqc":
        type: map
        mapping:
            "options":
                type: text
                required: false
            "config_file":
                type: str
                required: false
            "modules":
                type: text
                required: false
            

    "onsuccess":
        type: map
        mapping:
            "toclean":
                type: text
                required: true

    "raw_mapping":
        type: map
        mapping:
            "resources":
                type: any
                required: true

    "filtered_mapping":
        type: map
        mapping:
            "resources":
                type: any
                required: true
