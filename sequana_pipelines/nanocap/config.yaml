# ============================================================================
# Config file for Nanocap
# ==========================================[ Sections for the users ]========
#
# One of input_directory, input_pattern and input_samples must be provided
# If input_directory provided, use it otherwise if input_pattern provided,
# use it, otherwise use input_samples.
# ============================================================================
input_directory: /home/cokelaer/Work/github/forked/sequana_pipelines/nanocap/tests/resources
input_pattern: '*.fastq.gz'
# Reference for minimap2
reference: /home/cokelaer/Work/github/forked/sequana_pipelines/nanocap/tests/resources/vibrio.fa


apptainers:
    fastp: https://zenodo.org/record/17097941/files/fastp_1.0.1.img
    graphviz: https://zenodo.org/record/7928262/files/graphviz_7.0.5.img
    minimap2: https://zenodo.org/record/18257162/files/sequana_tools_26.1.14.img
    multiqc: https://zenodo.org/record/17100751/files/multiqc_1.27.0-zenodo1.img
    samtools: https://zenodo.org/record/18257162/files/sequana_tools_26.1.14.img
    sequana_coverage: https://zenodo.org/record/13946414/files/sequana_coverage_0.18.0.img



##############################################################################
# Fastp used to filter small reads
# Default options:
#  - `-q 0`: deactivate quality per base filter
#  - `-e 9`: filter read that has mean quality less than 10
#  - `-l 1000`: filter read shorter than 1000 bases
#
# :Parameters:
# - options: any options recognised by `fastp` cli
#
fastp:
    threads: 4
    options: -q 0 -e 9 -l 1000
    adapters: ''
    resources:
        mem_mb: 8000

##############################################################################
# Minimap2
#
# :Parameters:
# - options: any options recognised by `minimap2` cli
# - threads: Number of threads to use
minimap2:
    options: -ax map-ont
    threads: 4


raw_mapping:
    resources:
        mem_mb: 16000


filtered_mapping:
    resources:
        mem_mb: 16000


##############################################################################
# sequana_coverage detects ROIs on the mapped reads
#
# Parameters forwarded to sequana_coverage; see `sequana_coverage --help`.
sequana_coverage:
    circular: True
    window_size: 20001
    chunksize: 5000000
    double_threshold: 0.5
    gc_window_size: 201
    high_threshold: 4.
    low_threshold: -4.
    mixture_models: 2
    annotation_file: ''
    options: ''


##############################################################################
# Multiqc
#
# :Parameters:
# - options: any options recognised by `multiqc` cli
# - modules: modules needed for the report.
# - input_directory: where multiqc should look for logs/outputs (default: .)
# - config_file: optional multiqc config file
multiqc:
    options: ''
    input_directory: '.'
    config_file: multiqc_config.yaml
    modules: fastp sequana_coverage
