name: Apptainer Run

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
  pull_request:
    branches-ignore: []
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python: ['3.11']
      fail-fast: false

    steps:

    # Clean up unnecessary preinstalled packages to free disk space
    - name: Pre-cleanup
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    # Cache APT .deb packages
    - name: Cache APT archives
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-cache-v1

    # Cache Apptainer installation
    - name: Cache Apptainer install
      id: cache-apptainer
      uses: actions/cache@v4
      with:
        path: |
          /usr/bin/apptainer
          /usr/lib/apptainer
          /etc/apptainer
        key: ${{ runner.os }}-apptainer-v1

    # Install Apptainer only if not cached
    - name: Install Apptainer
      if: steps.cache-apptainer.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:apptainer/ppa
        sudo apt-get update
        sudo apt-get install -y apptainer

    # Recent Ubuntu runners restrict unprivileged user namespaces (AppArmor), which makes
    # apptainer fail to extract images ("Failed to create container process: Operation not
    # permitted"). This must be done on every run (not part of the apptainer cache).
    - name: Allow unprivileged user namespaces
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

    # Let apptainer mount SIF/EXT3 images instead of extracting them to a sandbox
    - name: Install squashfuse and fuse2fs
      run: |
        sudo apt-get install -y squashfuse fuse2fs || true

    # Cache Apptainer image cache (~/.apptainer/cache)
    - name: Cache Apptainer images
      uses: actions/cache@v4
      with:
        path: ~/.apptainer/cache
        key: ${{ runner.os }}-apptainer-images-v1

    # Checkout repository
    - name: Checkout repo
      uses: actions/checkout@v4

    # Set up Python
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    # Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    # Install package
    - name: Install package itself
      run: |
        pip install .

    # Run tests using Apptainer
    - name: Run Apptainer tests
      run: |
        sequana_nanocap --input-directory tests/resources/ --reference-file tests/resources/vibrio.fa --apptainer-prefix ~/.apptainer/cache && cd nanocap && bash nanocap.sh

    # The pipeline must create its main entry point and the per-sample reports
    - name: Check outputs
      run: |
        test -f nanocap/summary.html
        test -f nanocap/multiqc/multiqc_report.html
        test -f nanocap/references/vibrio.fa
        ls nanocap/*/nanocap.html
