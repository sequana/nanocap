[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "sequana-nanocap"
version = "0.5.0"
description = "Cleaning and control pipeline for adaptive sampling sequencing"
authors = ["Sequana Team <thomas.cokelaer@pasteur.fr>"]
license = "BSD-3"
repository = "https://github.com/sequana/nanocap"
readme = "README.rst"
keywords = ["pacbio", "nanopore", "snakemake", "sequana", "adaptative sampling"]
classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Intended Audience :: Education",
        "Intended Audience :: End Users/Desktop",
        "Intended Audience :: Developers",
        "Intended Audience :: Science/Research",
        "License :: OSI Approved :: BSD License",
        "Operating System :: POSIX :: Linux",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Topic :: Scientific/Engineering :: Bio-Informatics",
        "Topic :: Scientific/Engineering :: Information Analysis",
]

packages = [
    { include = "sequana_pipelines" }
]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
sequana = ">=0.18.0"
sequana_pipetools = ">=0.16.6"
sequana-wrappers = ">=26.4.1"
snakemake = ">=7.32"
pulp = ">=2.8"
click = "^8.1.7"
rich-click = "^1.7.2"
pandas = ">=2.0.0"
Jinja2 = ">=3.1.2"

[tool.poetry.scripts]
sequana_nanocap = "sequana_pipelines.nanocap.main:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
