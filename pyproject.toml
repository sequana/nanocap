[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "sequana-nanocap"
version = "0.4.0"
description = "Cleaning and control pipeline for adaptive sampling sequencing"
authors =[{name="Sequana Team", email="thomas.cokelaer@pasteur.fr"}]
license = "BSD-3"
repository = "https://github.com/sequana/nanocap"
keywords = ["pacbio", "nanopore", "snakemake", "sequana", "adaptative sampling"]
classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Intended Audience :: Education",
        "Intended Audience :: End Users/Desktop",
        "Intended Audience :: Developers",
        "Intended Audience :: Science/Research",
        "License :: OSI Approved :: BSD License",
        "Operating System :: POSIX :: Linux",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Topic :: Scientific/Engineering :: Bio-Informatics",
        "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.9,<4.0"
dependencies = [
    "sequana-pipetools >=1.2.0",
    "sequana >= 0.19",
    "pandas >= 2.0.0",
    "Jinja2 >=3.1.2",
    "click-completion >=0.5.2",
    "click >=8.1.7"
]

[tool.poetry]
packages = [
    { include = "sequana_pipelines" }
]






[tool.poetry.scripts]
sequana_nanocap = "sequana_pipelines.nanocap.main:main"

[tool.poetry.group.dev.dependencies]
pytest = "^5.2"
isort = "^5.10.1"
flake8 = "^4.0.1"
black = "^22.3.0"
ipython = "^8.2.0"


